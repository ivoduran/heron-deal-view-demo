<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Heron — Broker Deals Demo</title>
  <style>
    :root {
      --background: #f9fafb;
      --paper: #ffffff;
      --primary: #007ef4;
      --primary-50: #eff6ff;
      --text: #171717;
      --text-secondary: #6b7280;
      --slate-50: #f8fafc;
      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;
      --slate-300: #cbd5e1;
      --slate-400: #94a3b8;
      --slate-500: #64748b;
      --slate-600: #475569;
      --slate-700: #334155;
      --slate-800: #1e293b;
      --slate-900: #0f172a;
      --green-bg: #dcfce7;
      --green-text: #15803d;
      --blue-bg: #dbeafe;
      --blue-text: #1d4ed8;
      --amber-bg: #fef3c7;
      --amber-text: #b45309;
      --red-bg: #fee2e2;
      --red-text: #b91c1c;
      --violet: #8b5cf6;
      --card-shadow: 0 1px 2px rgba(31, 41, 55, 0.08);
      --button-shadow: 0 1px 2px rgba(31, 41, 55, 0.08);
      --font: "Roboto", "Helvetica", "Arial", sans-serif;
      --main-nav: 210px;
      --deal-nav: 0px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-width: 1180px;
      min-height: 100%;
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.43;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      color: inherit;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 2px solid rgba(0, 126, 244, 0.32);
      outline-offset: 1px;
    }

    .app {
      min-height: 100vh;
    }

    .main-nav {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 30;
      width: var(--main-nav);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      padding: 16px 0;
      background: var(--paper);
      box-shadow: -1px 0 0 #e5e7eb inset;
      transition: width 160ms ease;
    }

    .brand {
      height: 40px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 16px 8px;
      padding: 0 8px;
      white-space: nowrap;
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      flex: 0 0 32px;
    }

    .brand-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--slate-800);
    }

    .nav-stack {
      display: flex;
      flex-direction: column;
    }

    .nav-button {
      min-height: 40px;
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 8px 16px 0;
      padding: 8px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: #757575;
      cursor: pointer;
      text-align: left;
      white-space: nowrap;
      transition: background-color 160ms ease;
    }

    .nav-button:hover {
      background: #f5f5f5;
    }

    .nav-button.active {
      background: var(--primary-50);
      color: var(--primary);
    }

    .nav-button svg {
      width: 24px;
      height: 24px;
      flex: 0 0 24px;
    }

    .nav-label {
      font-size: 14px;
    }

    .nav-footer {
      padding-bottom: 4px;
    }

    .user-block {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 12px 18px 0;
      padding: 10px 6px 0;
      border-top: 1px solid var(--slate-100);
      white-space: nowrap;
    }

    .avatar {
      width: 30px;
      height: 30px;
      flex: 0 0 30px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--slate-800);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
    }

    .user-name {
      color: var(--slate-700);
      font-size: 12px;
      font-weight: 600;
    }

    .user-role {
      color: var(--slate-400);
      font-size: 11px;
    }

    .deal-nav {
      position: fixed;
      inset: 0 auto 0 var(--main-nav);
      z-index: 25;
      width: var(--deal-nav);
      overflow: hidden auto;
      background: var(--paper);
      box-shadow: -1px 0 0 #e5e7eb inset;
      transition: width 160ms ease, left 160ms ease;
    }

    .deal-nav-inner {
      width: 240px;
      min-height: 100vh;
      padding: 16px 8px 28px 16px;
    }

    .deal-nav-actions {
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .icon-button {
      width: 34px;
      height: 34px;
      display: inline-grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--slate-600);
      cursor: pointer;
    }

    .icon-button:hover {
      background: var(--slate-50);
    }

    .icon-button svg {
      width: 20px;
      height: 20px;
    }

    .deal-nav-name {
      margin: 0 8px 12px 0;
      color: #616161;
      font-size: 20px;
      font-weight: 600;
      line-height: 1.25;
      text-align: right;
    }

    .deal-nav-meta {
      margin: 0 8px 24px 0;
      color: var(--slate-500);
      font-size: 12px;
      text-align: right;
    }

    .deal-nav-section {
      margin: 0 0 28px;
    }

    .deal-nav-section-title {
      margin: 0 8px 4px 0;
      color: #9e9e9e;
      font-size: 11px;
      line-height: 20px;
      text-align: right;
    }

    .deal-nav-item {
      width: 100%;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      padding: 12px 8px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: #616161;
      cursor: pointer;
    }

    .deal-nav-item:hover {
      background: #fafafa;
    }

    .deal-nav-item.active {
      background: #f5f5f5;
    }

    .deal-nav-item svg {
      width: 18px;
      height: 18px;
    }

    .shell {
      min-height: 100vh;
      margin-left: calc(var(--main-nav) + var(--deal-nav));
      transition: margin-left 160ms ease;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 58px;
      display: flex;
      align-items: stretch;
      gap: 32px;
      padding: 0 32px;
      background: var(--paper);
      box-shadow: 0 -1px 0 #e5e7eb inset;
    }

    .page-kicker {
      display: flex;
      align-items: flex-end;
      padding-bottom: 12px;
      color: #757575;
      font-size: 14px;
      text-transform: uppercase;
    }

    .top-tabs {
      display: flex;
      align-items: stretch;
      gap: 32px;
    }

    .top-tab {
      position: relative;
      display: flex;
      align-items: flex-end;
      padding: 0 0 11px;
      border: 0;
      background: transparent;
      color: #616161;
      cursor: pointer;
    }

    .top-tab:hover {
      color: var(--text);
    }

    .top-tab.active {
      color: var(--primary);
    }

    .top-tab.active::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 2px;
      background: var(--primary);
    }

    .content {
      width: 100%;
      padding: 24px 32px 56px;
    }

    .content.list-content {
      max-width: 1600px;
      margin: 0 auto;
    }

    .page-header {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 16px;
    }

    .title-wrap {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    h1,
    h2,
    h3,
    h4,
    p {
      margin: 0;
    }

    h1 {
      color: var(--slate-800);
      font-size: 24px;
      line-height: 1.25;
      font-weight: 700;
    }

    h2 {
      color: var(--slate-800);
      font-size: 20px;
      line-height: 1.3;
      font-weight: 700;
    }

    h3 {
      color: var(--text);
      font-size: 1.25rem;
      line-height: 1.4;
      font-weight: 500;
    }

    h4 {
      color: var(--slate-800);
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .count-text,
    .muted {
      color: var(--slate-400);
    }

    .header-controls,
    .control-row,
    .inline,
    .button-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-controls {
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .search-field {
      height: 36px;
      display: flex;
      align-items: center;
      gap: 8px;
      width: 250px;
      padding: 0 12px;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      background: var(--paper);
      color: var(--slate-500);
    }

    .search-field svg {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
    }

    .search-field input {
      min-width: 0;
      width: 100%;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 13px;
    }

    .segmented {
      display: inline-flex;
      padding: 2px;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      background: var(--paper);
    }

    .segmented button {
      height: 30px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 12px;
      border: 0;
      border-radius: 3px;
      background: transparent;
      color: var(--slate-600);
      font-size: 13px;
      cursor: pointer;
    }

    .segmented button.active {
      background: var(--primary-50);
      color: var(--primary);
    }

    .segmented svg {
      width: 16px;
      height: 16px;
    }

    .stage-tabs {
      display: flex;
      align-items: stretch;
      min-height: 42px;
      margin-bottom: 20px;
      border-bottom: 1px solid #e5e7eb;
    }

    .stage-tab {
      position: relative;
      min-width: 0;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 18px;
      border: 0;
      background: transparent;
      color: var(--slate-600);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }

    .stage-tab:first-child {
      padding-left: 0;
      padding-right: 22px;
    }

    .stage-tab:hover {
      color: var(--text);
    }

    .stage-tab.active {
      color: var(--primary);
    }

    .stage-tab.active::after {
      content: "";
      position: absolute;
      inset: auto 12px -1px;
      height: 2px;
      background: currentColor;
    }

    .stage-tab:first-child.active::after {
      left: 0;
    }

    .stage-tab.review {
      margin-left: auto;
      color: var(--amber-text);
    }

    .stage-tab.review.active::after {
      background: var(--amber-text);
    }

    .tab-count {
      min-width: 21px;
      height: 20px;
      display: inline-grid;
      place-items: center;
      padding: 0 6px;
      border-radius: 4px;
      background: var(--slate-100);
      color: var(--slate-600);
      font-size: 11px;
      font-weight: 600;
    }

    .stage-tab.active .tab-count {
      background: var(--blue-bg);
      color: var(--blue-text);
    }

    .stage-tab.review .tab-count {
      background: var(--amber-bg);
      color: var(--amber-text);
    }

    .card {
      overflow: hidden;
      border-radius: 8px;
      background: var(--paper);
      box-shadow: var(--card-shadow);
    }

    .card-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 24px 12px;
    }

    .card-header.compact {
      align-items: center;
    }

    .header-hint {
      overflow: hidden;
      color: var(--slate-400);
      font-size: 13px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .table-scroll {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th {
      padding: 12px 16px;
      border-bottom: 1px solid var(--slate-200);
      color: var(--slate-400);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-align: left;
      text-transform: uppercase;
      white-space: nowrap;
    }

    td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--slate-100);
      color: var(--slate-600);
      font-size: 13px;
      vertical-align: middle;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    tbody tr.interactive {
      cursor: pointer;
    }

    tbody tr:hover {
      background: var(--slate-50);
    }

    .business-name,
    .funder-name {
      color: var(--slate-700);
      font-size: 13px;
      font-weight: 600;
    }

    .business-sub,
    .small-copy {
      margin-top: 2px;
      color: var(--slate-400);
      font-size: 11px;
    }

    .amount {
      color: var(--slate-800);
      font-size: 13px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .date {
      color: var(--slate-500);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .flag-line {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 3px;
      color: var(--amber-text);
      font-size: 11px;
    }

    .flag-line svg {
      width: 13px;
      height: 13px;
    }

    .chip {
      min-height: 24px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      line-height: 18px;
      white-space: nowrap;
    }

    .chip.small {
      min-height: 20px;
      padding: 1px 6px;
      font-size: 11px;
      line-height: 18px;
    }

    .chip.green {
      background: var(--green-bg);
      color: var(--green-text);
    }

    .chip.blue {
      background: var(--blue-bg);
      color: var(--blue-text);
    }

    .chip.amber {
      background: var(--amber-bg);
      color: var(--amber-text);
    }

    .chip.red {
      background: var(--red-bg);
      color: var(--red-text);
    }

    .chip.slate {
      background: var(--slate-100);
      color: var(--slate-600);
    }

    .chip.hollow {
      border: 1px solid var(--slate-200);
      background: transparent;
      color: var(--slate-500);
    }

    .decision-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .btn {
      min-height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 5px 12px;
      border: 1px solid transparent;
      border-radius: 4px;
      box-shadow: var(--button-shadow);
      font-size: 13px;
      font-weight: 500;
      line-height: 20px;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn svg {
      width: 16px;
      height: 16px;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: #006dcc;
    }

    .btn-disabled-look {
      border-color: var(--slate-200);
      background: var(--slate-100);
      color: var(--slate-500);
    }

    .btn-disabled-look:hover {
      background: var(--slate-100);
    }

    .btn-outline {
      border-color: #e5e7eb;
      background: #fff;
      color: var(--text);
    }

    .btn-outline:hover {
      background: var(--background);
    }

    .btn-text {
      padding-inline: 6px;
      border: 0;
      box-shadow: none;
      background: transparent;
      color: var(--primary);
    }

    .btn-text:hover {
      background: var(--primary-50);
    }

    .btn:disabled {
      cursor: default;
      opacity: 0.45;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(5, minmax(180px, 1fr));
      gap: 12px;
      min-width: 948px;
      overflow-x: auto;
      align-items: start;
    }

    .lane {
      min-height: 410px;
      padding: 12px;
      border-radius: 8px;
      background: var(--slate-100);
    }

    .lane-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding: 2px 2px 8px;
      color: var(--slate-700);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .deal-card {
      width: 100%;
      display: block;
      margin-bottom: 8px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: var(--paper);
      box-shadow: var(--card-shadow);
      cursor: pointer;
      text-align: left;
    }

    .deal-card:hover {
      box-shadow: 0 2px 6px rgba(31, 41, 55, 0.14);
    }

    .deal-card .amount {
      margin: 10px 0 8px;
      font-size: 15px;
    }

    .deal-card-footer {
      margin-top: 10px;
      color: var(--slate-400);
      font-size: 11px;
    }

    .empty {
      padding: 40px 24px;
      color: var(--slate-400);
      font-size: 13px;
      text-align: center;
    }

    .review-card .card-header {
      padding-bottom: 18px;
    }

    .review-item {
      display: grid;
      grid-template-columns: 34px minmax(320px, 1fr) minmax(360px, auto);
      align-items: center;
      gap: 16px;
      padding: 16px 24px;
      border-top: 1px solid var(--slate-100);
    }

    .review-icon {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--amber-bg);
      color: var(--amber-text);
    }

    .review-icon svg {
      width: 18px;
      height: 18px;
    }

    .review-subject {
      color: var(--slate-700);
      font-size: 13px;
      font-weight: 600;
    }

    .review-meta,
    .suggestion {
      margin-top: 3px;
      color: var(--slate-500);
      font-size: 12px;
    }

    .suggestion {
      color: var(--blue-text);
    }

    .review-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .select {
      height: 34px;
      min-width: 210px;
      padding: 0 28px 0 10px;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      background: #fff;
      color: var(--slate-700);
      font-size: 13px;
    }

    .deal-banner {
      min-height: 50px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 16px;
      padding: 4px 0;
    }

    .deal-banner-main {
      min-width: 0;
    }

    .deal-banner-title {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      min-height: 28px;
    }

    .deal-title {
      color: var(--slate-800);
      font-size: 1.25rem;
      font-weight: 700;
    }

    .stage-state {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--slate-700);
      font-size: 13px;
      font-weight: 600;
    }

    .stage-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--slate-400);
    }

    .stage-dot.new {
      background: var(--slate-400);
    }

    .stage-dot.ready {
      background: var(--blue-text);
    }

    .stage-dot.shopped {
      background: var(--green-text);
    }

    .stage-dot.offers {
      background: var(--primary);
    }

    .stage-dot.closed {
      background: var(--slate-800);
    }

    .banner-summary,
    .identity-line {
      color: var(--slate-600);
      font-size: 13px;
    }

    .identity-line {
      margin-top: 4px;
      color: var(--slate-500);
    }

    .aggregate-chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      padding-top: 2px;
    }

    .deal-columns {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 16px;
    }

    .deal-main-column {
      min-width: 0;
      flex: 1 1 680px;
      display: grid;
      gap: 16px;
    }

    .deal-side-column {
      min-width: 340px;
      max-width: 420px;
      flex: 1 1 340px;
      display: grid;
      gap: 16px;
    }

    .about-card {
      padding-bottom: 20px;
    }

    .about-card .card-header {
      align-items: center;
      padding: 20px 24px 12px;
    }

    .about-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .about-actions .btn {
      min-height: 28px;
      padding: 3px 9px;
      font-size: 11px;
    }

    .drawer-overlay.open {

    .drawer {

      inset: 0 0 0 auto;

      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 24px;
      border-bottom: 1px solid var(--slate-200);

      align-items: center;
      flex-wrap: wrap;
      gap: 9px;
      color: var(--slate-800);

      font-weight: 700;

      overflow-y: auto;
      padding: 22px 24px;
    }

    .drawer-footer {
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 24px;
      border-top: 1px solid var(--slate-200);

      margin: 0 0 8px;
      color: var(--slate-400);
      font-size: 11px;
      font-weight: 600;

    .evaluation-icon svg {
      width: 14px;
      height: 14px;
    }

    .evaluation-name {

      font-weight: 600;

    .evaluation-value,

    .toast {

      left: 50%;
      top: 24px;
      width: max-content;
      max-width: 480px;
      display: flex;
      align-items: center;
      gap: 12px;
      transform: translateX(-50%) scale(0.92);
      visibility: hidden;
      padding: 12px 14px 12px 16px;
      border: 1px solid #b6e0f2;
      border-radius: 4px;
      background: #e5f6fd;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.16);

    .toast.success {
      border-color: #b7dfb9;
      background: #edf7ed;
      color: #1e4620;
    }

    .toast-close {
      width: 28px;
      height: 28px;
      flex: 0 0 28px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: inherit;
      cursor: pointer;
      opacity: 0.72;

    .toast-close:hover {
      background: rgba(0, 0, 0, 0.06);
      opacity: 1;
    }

    .toast-close svg {
      width: 18px;
      height: 18px;
    }

    .toast.show {
      visibility: visible;
      transform: translateX(-50%) scale(1);
      opacity: 1;
    }

    @media (max-width: 1350px) {
      .content {
        padding-inline: 24px;
      }

      .deal-side-column {
        max-width: 100%;
      }

      .metric-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }
  </style>

    function chip(label, kind = "slate", small = false) {
      return `<span class="chip ${kind}${small ? " small" : ""}">${escapeHtml(label)}</span>`;
    }

    function decisionCounts(deal) {
      const counts = { approved: 0, stips: 0, declined: 0, awaiting: 0 };
      getFunders(deal).forEach((funder) => {
        if (funder.decision && Object.hasOwn(counts, funder.decision.status)) {
          counts[funder.decision.status] += 1;
        }
      });
      return counts;
    }

    function listDecisionCounts(deal) {
      const counts = decisionCounts(deal);
      const approved = counts.approved;
      const pending = counts.stips + counts.awaiting;
      if (!approved && !counts.declined && !pending) return '<span class="muted">—</span>';
      return `<div class="decision-chips">${approved ? chip(`${approved} approved`, "green", true) : ""}${counts.declined ? chip(`${counts.declined} declined`, "red", true) : ""}${pending ? chip(`${pending} pending`, "slate", true) : ""}</div>`;
    }

    function genericEmail(deal, funderName, status, amount = null) {
      const statusLabel = decisionLabels[status];
      return {
        from: `decisions@${funderName.toLowerCase().replaceAll(/[^a-z]/g, "")}.example`,
        subject: `${statusLabel} — ${deal.name}`,
        received: `${deal.latest}, 11:18 AM`,
        body: amount
          ? [`${deal.legal} has been ${statusLabel.toLowerCase()}.`, `${moneyFull(amount)} funded amount · 1.39 factor · 8 months.`, "Please reply with any questions."]
          : [`Thank you for the submission for ${deal.legal}.`, `Decision: ${statusLabel.toLowerCase()}.`, status === "declined" ? "Reason: current credit box requirements were not met." : "We will follow up with next steps."]
      };
    }

    function generatedFunders(deal) {
      if (deal.stage === "new") return [];
      if (deal.stage === "ready") {
        return defaultFunderNames.slice(0, 4).map((name, index) => ({
          name,
          match: index === 3 ? "failed" : "matched",
          failure: index === 3 ? "Average daily balance $1K (needs $2K)" : null,
          priority: index === 0,
          submission: index === 3 ? null : { status: "not_sent", channel: index === 2 ? "API" : "email" },
          latest: deal.latest
        }));
      }
      if (deal.stage === "shopped") {
        return defaultFunderNames.slice(0, 4).map((name, index) => ({
          name,
          match: "matched",
          priority: index === 0,
          submission: index === 3 && deal.id === "harbor-point"
            ? { status: "failed", date: deal.latest, channel: "email", note: "Recipient rejected message" }
            : { status: "sent", date: deal.latest, channel: index === 2 ? "API" : "email" },
          decision: index === 3 && deal.id === "harbor-point" ? null : { status: "awaiting", terms: "—", received: deal.latest },
          latest: deal.latest
        }));
      }
      if (deal.stage === "offers") {
        return defaultFunderNames.slice(0, 5).map((name, index) => {
          const statuses = ["approved", "approved", "stips", "declined", "awaiting"];
          const status = statuses[index];
          const offerAmount = status === "approved" ? Math.round(deal.requested * (index === 0 ? 0.85 : 0.6) / 5000) * 5000 : null;
          return {
            name,
            match: "matched",
            priority: index === 0,
            submission: { status: "sent", date: deal.received, channel: index === 3 ? "API" : "email" },
            decision: {
              status,
              terms: offerAmount ? `${money(offerAmount)} · 1.${index === 0 ? "35" : "42"} · ${index === 0 ? "7" : "9"}mo` : status === "stips" ? "2 documents requested" : status === "declined" ? "Credit box" : "—",
              received: deal.latest,
              offer: offerAmount ? { amount: offerAmount, factor: index === 0 ? "1.35" : "1.42", term: index === 0 ? "7 months" : "9 months", payment: `${money(Math.round(offerAmount * 1.35 / 30))} / wk`, position: "1st", received: deal.latest, tag: index === 0 ? "best" : null, portal: index === 0 } : null,
              email: status === "awaiting" ? null : genericEmail(deal, name, status, offerAmount),
              history: `Submitted ${deal.received} → ${decisionLabels[status]} ${deal.latest}`
            },
            latest: deal.latest
          };
        });
      }
      const funded = deal.id === "falcon-hvac";
      return defaultFunderNames.slice(0, 4).map((name, index) => {
        const status = funded && index === 0 ? "approved" : "declined";
        const offerAmount = status === "approved" ? 95000 : null;
        return {
          name,
          match: "matched",
          priority: index === 0,
          submission: { status: "sent", date: deal.received, channel: index === 2 ? "API" : "email" },
          decision: {
            status,
            terms: offerAmount ? "$95K · 1.36 · 8mo" : "Credit box",
            received: deal.latest,
            offer: offerAmount ? { amount: offerAmount, factor: "1.36", term: "8 months", payment: "$3,715 / wk", position: "1st", received: deal.latest, tag: "best", portal: true } : null,
            email: genericEmail(deal, name, status, offerAmount),
            history: `Submitted ${deal.received} → ${decisionLabels[status]} ${deal.latest}`
          },
          latest: deal.latest
        };
      });
    }

    function getFunders(deal) {
      if (!deal.funders) deal.funders = generatedFunders(deal);
      return deal.funders;
    }

    function activityForDeal(deal) {
      if (deal.activity) return deal.activity;
      const funders = getFunders(deal);
      const events = [];
      funders.forEach((funder) => {
        if (!funder.decision || funder.decision.status === "awaiting") return;
        events.push({
          type: funder.decision.status,
          title: `${decisionLabels[funder.decision.status]} from ${funder.name}`,
          meta: `${funder.decision.terms} · ${funder.latest}`
        });
      });
      if (deal.stage === "ready") events.push({ type: "approved", title: "Funder matching complete", meta: `${funders.filter((f) => f.match === "matched").length} matched · ${deal.latest}` });
      if (["shopped", "offers", "closed"].includes(deal.stage)) events.push({ type: "submitted", title: `Submitted to ${funders.filter((f) => f.submission?.status === "sent").length} funders`, meta: `${deal.received}` });
      events.push({ type: "received", title: "Application parsed", meta: `Application and bank statements · ${deal.received}` });
      return events;
    }

    function matchEvaluation(deal, funder) {
      const rules = {
        state: "all states",
        minRevenue: ["ECG", "Kapitus"].includes(funder.name) ? 25 : 15,
        minYears: ["OnDeck", "Rapid Finance"].includes(funder.name) ? 2 : 1,
        minFico: ["Kapitus", "OnDeck"].includes(funder.name) ? 620 : 550,
        maxPositions: 3,
        maxRequested: funder.name === "Expansion Capital" ? 100 : 750
      };
      const rows = [
        { name: "State", requirement: rules.state, value: deal.state, pass: true },
        { name: "Industry", requirement: "not restricted", value: deal.industry, pass: true },
        { name: "Monthly revenue", requirement: `min $${rules.minRevenue}K`, value: `$${deal.facts.revenue}K`, pass: deal.facts.revenue >= rules.minRevenue },
        { name: "Time in business", requirement: `min ${rules.minYears}y`, value: `${deal.facts.years}y`, pass: deal.facts.years >= rules.minYears },
        { name: "Owner FICO", requirement: `min ${rules.minFico}`, value: deal.facts.fico ?? "—", pass: !deal.facts.fico || deal.facts.fico >= rules.minFico },
        { name: "Open positions", requirement: `max ${rules.maxPositions}`, value: deal.facts.positions, pass: deal.facts.positions <= rules.maxPositions },
        { name: "Requested amount", requirement: `max $${rules.maxRequested}K`, value: money(deal.requested), pass: deal.requested / 1000 <= rules.maxRequested },
        { name: "Bankruptcy history", requirement: "no open bankruptcy", value: "None", pass: true },
        { name: "Negative balance days", requirement: "max 3", value: "0", pass: true }
      ];
      if (funder.name === "Everest Capital") rows.push({ name: "Broker blacklist", requirement: "not excluded", value: "Excluded in broker settings", pass: false });
      if (funder.match === "failed" && rows.every((row) => row.pass)) rows[rows.length - 1].pass = false;
      const failures = rows.filter((row) => !row.pass);
      return {
        rows,
        passCount: rows.length - failures.length,
        ok: failures.length === 0,
        tooltip: failures.length ? failures.map((row) => `${row.name}: ${row.value} (needs ${row.requirement})`).join(" · ") : `Passes all ${rows.length} criteria`
      };
    }

    function activityIcon(type) {
      if (type === "approved") return icons.check;
      if (type === "stips") return icons.warning;
      if (type === "declined") return icons.cross;
      if (type === "submitted") return icons.send;
      return icons.document;
    }

    function renderActivity(deal) {
      return `
        <div class="card activity-card">
          <h3>Activity</h3>
          <div class="activity-list">
            ${activityForDeal(deal).map((event) => `<div class="activity-event ${event.type}">${activityIcon(event.type)}<div><div class="activity-title">${escapeHtml(event.title)}</div><div class="activity-meta">${escapeHtml(event.meta)}</div></div></div>`).join("")}
          </div>
        </div>
      `;
    }

    function submissionCell(funder, index) {
      const submission = funder.submission;
      if (!submission) return '<span class="muted">—</span>';
      if (submission.status === "sent") {
        return `<div class="submission-state">${submission.channel === "API" ? icons.code : icons.mail}<span>Sent ${escapeHtml(submission.date)} · ${escapeHtml(submission.channel)}</span></div>`;
      }
      if (submission.status === "not_sent") {
        return `<button class="btn btn-outline" onclick="event.stopPropagation(); disabledAction()">${icons.send}Submit</button>`;
      }
      if (submission.status === "failed") {
        return `<div class="submission-state" title="${escapeHtml(submission.note)}">${icons.warning}<span class="failure-text">Send failed</span><button class="text-link" onclick="event.stopPropagation(); disabledAction()">Retry</button></div>`;
      }
      if (submission.status === "missing_data") {
        return `<div>${chip("Missing data", "amber", true)}<div class="small-copy">${escapeHtml(submission.note)}</div></div>`;
      }
      return chip("Not sent via Heron", "slate", true);
    }

    function renderFunders(deal) {
      const sectionForFunder = (funder) => {
        if (funder.decision || ["sent", "failed", "missing_data", "outside"].includes(funder.submission?.status)) return "activity";
        if (funder.match === "failed") return "excluded";
        if (funder.submission?.status === "not_sent") return "ready";
        return "sheet";
      };
      const sections = [
        { key: "activity", label: "With activity" },
        { key: "ready", label: "Ready to send" },
        { key: "excluded", label: "Excluded" },
        { key: "sheet", label: "Funder sheet" }
      ];
      const sorted = [...getFunders(deal)]
        .filter((funder) => funder.name.toLowerCase().includes(state.funderQuery.toLowerCase()))
        .sort((a, b) => state.funderSort === "priority"
          ? Number(Boolean(b.priority)) - Number(Boolean(a.priority))
          : Number(a.match === "failed") - Number(b.match === "failed"));
      const renderRow = (funder) => {
        const sourceIndex = getFunders(deal).indexOf(funder);
        const evaluation = matchEvaluation(deal, funder);
        const decision = funder.decision;
        return `
          <tr>
            <td class="checkbox-col">${funder.submission?.status === "not_sent" ? `<input type="checkbox" aria-label="Select ${escapeHtml(funder.name)}" ${state.selectedFunders.has(funder.name) ? "checked" : ""} onchange="toggleFunder('${escapeHtml(funder.name)}')">` : ""}</td>
            <td><span class="section-chevron">›</span><button class="text-link funder-name" onclick="openEvaluation('${deal.id}', ${sourceIndex})">${escapeHtml(funder.name)}</button>${funder.priority ? '<span title="Priority funder" style="color:#facc15;margin-left:5px">★</span>' : ""}</td>
            <td><button class="match-state matrix${evaluation.ok ? "" : " failed"}" data-tooltip="${escapeHtml(evaluation.tooltip)}" onclick="openEvaluation('${deal.id}', ${sourceIndex})" aria-label="${evaluation.ok ? "Matched" : `Fails: ${escapeHtml(funder.failure || "criteria")}`}"><span class="check-strip">${evaluation.rows.map((row) => `<span class="check-square${row.pass ? "" : " failed"}"></span>`).join("")}</span></button></td>
            <td>${submissionCell(funder, sourceIndex)}</td>
            <td>${decision ? `<button class="decision-button" ${decision.email ? `onclick="openDecision('${deal.id}', ${sourceIndex})"` : `onclick="event.stopPropagation(); disabledAction()"`}>${chip(decisionLabels[decision.status], decisionClasses[decision.status], true)}</button>` : '<span class="muted">—</span>'}</td>
            <td><div class="key-terms" title="${escapeHtml(decision?.terms || "")}">${escapeHtml(decision?.terms || "—")}</div></td>
            <td><span class="date">${escapeHtml(funder.latest || "—")}</span></td>
          </tr>
        `;
      };
      const rows = sections.map((section) => {
        const sectionFunders = sorted.filter((funder) => sectionForFunder(funder) === section.key);
        if (!sectionFunders.length) return "";
        return `<tr class="section-row"><td colspan="7">${escapeHtml(section.label)} · ${sectionFunders.length}</td></tr>${sectionFunders.map(renderRow).join("")}`;
      }).join("");
      return `
        <div class="card funders-card">
          <div class="card-header">
            <div class="inline" style="align-items:baseline"><h3>Funders</h3><span class="header-hint">Match, submission, and decision — one row per funder · ${getFunders(deal).filter((funder) => funder.submission || funder.decision).length} with activity</span></div>
          </div>
          <div class="funder-controls">
            <div class="segmented">
              <button class="${state.funderSort === "priority" ? "active" : ""}" onclick="setFunderSort('priority')">Broker priority</button>
              <button class="${state.funderSort === "fit" ? "active" : ""}" onclick="setFunderSort('fit')">Best fit</button>
            </div>
            <label class="search-field funder-search">${icons.search}<input type="search" placeholder="Search funders" value="${escapeHtml(state.funderQuery)}" oninput="setFunderQuery(this.value)"></label>
            <button class="btn ${state.selectedFunders.size ? "btn-primary" : "btn-disabled-look"}" onclick="disabledAction()">${icons.send}Submit selected (${state.selectedFunders.size})</button>
            <button class="btn btn-outline" onclick="disabledAction()">${icons.plus}Add funder</button>
          </div>
          ${getFunders(deal).length ? `<div class="table-scroll"><table class="funder-table" aria-label="Funders"><thead><tr><th class="checkbox-col"></th><th>Funder</th><th>Match</th><th>Submission</th><th>Decision</th><th>Key terms</th><th>Latest</th></tr></thead><tbody>${rows || '<tr><td colspan="7"><div class="empty">No funders match that search.</div></td></tr>'}</tbody></table></div>` : `<div class="empty">Funder matching runs once the file is complete${deal.flag ? ` — ${escapeHtml(deal.flag.toLowerCase())}` : ""}.</div>`}
        </div>
      `;
    }

    function collectOffers(deal) {
      return getFunders(deal)
        .flatMap((funder, index) => {
          const offer = funder.decision?.offer;
          if (!offer) return [];
          return [offer, ...(funder.decision.offerHistory || [])].map((offerEntry) => ({ funder, index, offer: offerEntry }));
        })
        .filter((entry) => entry.offer)
        .sort((a, b) => b.offer.amount - a.offer.amount);
    }

    function renderOffers(deal) {
      const offers = collectOffers(deal);
      if (!offers.length) return "";
      return `

              <span class="stage-state"><span class="stage-dot ${deal.stage}"></span>${escapeHtml(stageSummaries[deal.stage])}</span>
              ${chip(`req ${money(deal.requested)}`, "slate", true)}
              <span class="banner-summary">${sent ? `sent to ${sent} funders` : "not shopped yet"} · latest activity ${escapeHtml(deal.latest)}</span>
              ${deal.flag ? chip(deal.flag, "amber", true) : ""}
            </div>
            <div class="identity-line">dba ${escapeHtml(deal.dba)} · ${escapeHtml(deal.ein)} · ${escapeHtml(deal.industry)} · ${escapeHtml(deal.state)}</div>
          </div>
          <div class="aggregate-chips">${aggregates}</div>
        </div>
        <div class="deal-columns">
          <div class="deal-main-column">
            ${renderOffers(deal)}
            ${renderFunders(deal)}
            ${renderNotes(deal)}
          </div>
          <div class="deal-side-column">
            ${renderAboutDeal(deal)}
            ${renderActivity(deal)}
          </div>
        </div>
      `;
    }

    function showDrawer(html) {
      const drawer = document.getElementById("drawer");
      drawer.innerHTML = html;
      drawer.classList.add("open");
      document.getElementById("drawerOverlay").classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function closeDrawer() {
      document.getElementById("drawer").classList.remove("open");
      document.getElementById("drawerOverlay").classList.remove("open");
      document.body.style.overflow = "";
    }

    function openDecision(dealId, funderIndex) {
      const deal = dealById(dealId);
      const funder = getFunders(deal)[funderIndex];
      const decision = funder?.decision;
      if (!decision?.email) {
        disabledAction();
        return;
      }
      const email = decision.email;
      const offer = decision.offer;
      const parsedOffer = offer ? `
        <div class="drawer-section">
          <div class="section-label">Parsed offer</div>
          <div class="offer-grid">
            ${offerCell("Funded amount", moneyFull(offer.amount))}
            ${offerCell("Factor", offer.factor)}
            ${offerCell("Term", offer.term)}
            ${offerCell("Payment", offer.payment)}
            ${offerCell("Position", offer.position)}
            ${offerCell("Received", offer.received)}
          </div>
          ${offer.portal ? `<div style="margin-top:12px"><button class="btn btn-primary" onclick="disabledAction()">${icons.external}Offer portal</button></div>` : ""}
        </div>
      ` : "";
      showDrawer(`
        <div class="drawer-header">
          <div class="drawer-title">${escapeHtml(funder.name)} ${chip(decisionLabels[decision.status], decisionClasses[decision.status], true)}</div>
          <button class="icon-button" onclick="closeDrawer()" aria-label="Close">${icons.x}</button>
        </div>
        <div class="drawer-body">
          <div class="drawer-section">
            <div class="section-label">Original funder email</div>
            <div class="email-box">
              <div class="email-head">
                <div class="email-row"><span class="email-key">From</span><span class="email-value">${escapeHtml(email.from)}</span></div>
                <div class="email-row"><span class="email-key">Subject</span><span class="email-value">${escapeHtml(email.subject)}</span></div>
                <div class="email-row"><span class="email-key">Received</span><span class="email-value">${escapeHtml(email.received)}</span></div>
              </div>
              <div class="email-body">${email.body.map((line) => `<p>${escapeHtml(line)}</p>`).join("")}</div>
            </div>
          </div>
          ${parsedOffer}
          <div class="history">History: ${escapeHtml(decision.history || `${decisionLabels[decision.status]} ${decision.received}`)}</div>
        </div>
        <div class="drawer-footer">
          <span class="history">The source email stays on its own record.</span>
          <button class="btn btn-outline" onclick="disabledAction()">${icons.external}Open decision end user</button>
        </div>
      `);
    }

    function offerCell(key, value) {
      return `<div class="offer-cell"><div class="offer-cell-key">${escapeHtml(key)}</div><div class="offer-cell-value">${escapeHtml(value)}</div></div>`;
    }

    function openEvaluation(dealId, funderIndex) {
      const deal = dealById(dealId);
      const funder = getFunders(deal)[funderIndex];
      const evaluation = matchEvaluation(deal, funder);
      showDrawer(`
        <div class="drawer-header">
          <div class="drawer-title">${escapeHtml(funder.name)} ${chip(evaluation.ok ? "Matched" : "Excluded", evaluation.ok ? "green" : "red", true)}</div>
          <button class="icon-button" onclick="closeDrawer()" aria-label="Close">${icons.x}</button>
        </div>
        <div class="drawer-body">
          <div class="drawer-section">
            <div class="section-label">Match evaluation</div>
            <div class="evaluation-summary">${evaluation.passCount} of ${evaluation.rows.length} criteria pass</div>
            <div class="evaluation-box">
              ${evaluation.rows.map((row) => `
                <div class="evaluation-row${row.pass ? "" : " failed"}">
                  <div class="evaluation-icon">${row.pass ? icons.checkPlain : icons.x}</div>
                  <div class="evaluation-name">${escapeHtml(row.name)}</div>
                  <div class="evaluation-value">${escapeHtml(row.value)}</div>
                  <div class="evaluation-requirement">${escapeHtml(row.requirement)}</div>
                </div>
              `).join("")}
            </div>
          </div>
          <div class="history">Evaluated at matching time against this funder's criteria in broker settings.</div>
          ${funder.decision?.email ? `<div style="margin-top:16px"><button class="btn btn-outline" onclick="openDecision('${dealId}', ${funderIndex})">${icons.mail}View decision email</button></div>` : ""}
        </div>
        <div class="drawer-footer"><span class="history">Criteria are managed in Settings → Broker → Funders.</span></div>
      `);
    }

    function openDeal(id) {
      state.screen = "deal";
      state.activeDealId = id;
      state.activeDealPage = "deal";
      state.funderQuery = "";
      state.selectedFunders.clear();
      closeDrawer();
      render();
      window.scrollTo({ top: 0, behavior: "instant" });
    }

    function openDealPage(page) {
      state.activeDealPage = page;
      closeDrawer();
      render();
      window.scrollTo({ top: 0, behavior: "instant" });
    }

    function goList() {
      state.screen = "list";
      closeDrawer();
      render();
      window.scrollTo({ top: 0, behavior: "instant" });
    }

    function rowKey(event, id) {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openDeal(id);
      }
    }

    function setListView(view) {
      state.listView = view;
      renderDealsList();
    }

    function setStage(stage) {
      state.stage = stage;
      renderDealsList();
    }

    function setQuery(query) {
      state.query = query;
      renderDealsList();
      const input = document.getElementById("dealSearch");
      if (input) {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      }
    }

    function setFunderQuery(query) {
      state.funderQuery = query;
      renderDealPage();
      const input = document.querySelector(".funder-search input");
      if (input) {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      }
    }

    function setFunderSort(sort) {
      state.funderSort = sort;
      renderDealPage();
    }

    function setDebtView(view) {
      state.debtView = view;
      renderBankDebtPage();
    }

    function toggleFunder(name) {
      if (state.selectedFunders.has(name)) state.selectedFunders.delete(name);
      else state.selectedFunders.add(name);
      renderDealPage();
    }

    function linkReview(id) {
      const select = document.getElementById(`select-${id}`);
      if (!select?.value) {
        showToast("Choose a deal first");
        return;
      }
      const deal = dealById(select.value);
      reviewItems = reviewItems.filter((item) => item.id !== id);
      renderDealsList();
      showToast(`Decision linked to ${deal.name} — source email kept as evidence`, "success");
    }

    function dismissReview(id) {
      reviewItems = reviewItems.filter((item) => item.id !== id);
      renderDealsList();
      showToast("Reply dismissed — kept in the audit trail");
    }

    function saveNotes(kind) {
      const deal = dealById(state.activeDealId);
      const input = document.getElementById(`${kind}Notes`);
      if (kind === "internal") deal.internalNotes = input.value;
      else deal.submissionNotes = input.value;
      showToast("Notes saved for this demo session", "success");
    }

    function disabledAction() {
      showToast("Demo environment — action disabled");
    }

    function notInDemo() {
      showToast("Not available in this demo");
    }

    function navToast(label) {
      if (label === "Deals") {
        goList();
        return;
      }
      disabledAction();
    }

    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    let toastTimer;
    function closeToast() {
      const toast = document.getElementById("toast");
      toast.classList.remove("show");
      window.clearTimeout(toastTimer);
    }

    function showToast(message, severity = "info") {
      const toast = document.getElementById("toast");
      document.getElementById("toastMessage").textContent = message;
      toast.className = `toast ${severity} show`;
      window.clearTimeout(toastTimer);
      toastTimer = window.setTimeout(closeToast, 6000);
    }

    function render() {
      renderMainNav();
      renderDealNav();
      renderTopbar();
      if (state.screen === "list") renderDealsList();
      else if (state.activeDealPage === "data_sources") renderDataSourcesPage();
      else if (state.activeDealPage === "bank_debt") renderBankDebtPage();
      else renderDealPage();
    }

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeDrawer();
    });

    render();
  </script>
</body>
</html>
